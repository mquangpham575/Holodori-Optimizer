endpoints:
  - name: frontend
    group: hololive-dreams
    url: https://hololive-dream.vercel.app
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[RESPONSE_TIME] < 2000"

  - name: backend-api
    group: hololive-dreams
    url: https://site--hololive-dream--mv2hgs5fgpjc.code.run/api/health
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].status == operational"
      - "[RESPONSE_TIME] < 2000"

  - name: postgres-database
    group: hololive-dreams
    url: https://site--hololive-dream--mv2hgs5fgpjc.code.run/api/health
    interval: 1m
    conditions:
      - "[STATUS] == 200"
      - "[BODY].services.postgres == operational"

